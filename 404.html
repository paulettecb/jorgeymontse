<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Jorge &amp; Montse</title>
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;
       background:#551724;color:#F6F4EE;text-align:center;padding:32px}
  .caja{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:34ch}
  .sello{width:52px;height:60px;background:#C9CFB2;
         -webkit-mask:url('assets/monogram-mark.png') center/contain no-repeat;
         mask:url('assets/monogram-mark.png') center/contain no-repeat}
  h1{margin:0;font-family:'Lumiare',sans-serif;font-weight:400;
     font-size:clamp(28px,5vw,44px);line-height:1.1}
  p{margin:0;font-family:'NoirEtBlanc',serif;font-size:18px;line-height:1.65;opacity:.88}
  a{display:inline-block;margin-top:6px;padding:15px 30px 13px;border:1px solid rgba(246,244,238,.45);
    border-radius:999px;font-family:'NoirEtBlanc',serif;text-transform:uppercase;
    font-size:14px;letter-spacing:.18em;line-height:1;transition:background .25s,color .25s}
  a:hover,a:focus-visible{background:#F6F4EE;color:#631B29}
</style>
</head>
<body>
  <div class="caja">
    <div class="sello" aria-hidden="true"></div>
    <h1>Esta página no existe</h1>
    <p>Puede que el link se haya cortado al copiarlo. Desde la invitación llegas a todo.</p>
    <a href="/">Ir a la invitación</a>
  </div>
</body>
