[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El panel de invitados nunca debe indexarse. Los datos igual están
# detrás de contraseña en la función, pero esto evita que la página
# siquiera aparezca en buscadores.
# Sin esto Netlify lo manda como octet-stream y el iPhone, en vez de
# abrirlo en Calendario, pregunta si quieres descargar un archivo.
[[headers]]
  for = "/assets/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

[[headers]]
  for = "/panel"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/panel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El libro de recuerdos, igual: los invitados escriben ahí creyendo —con
# razón— que sólo lo leen Jorge y Montse. Va detrás de la misma contraseña
# y además fuera de los buscadores.
[[headers]]
  for = "/libro"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/libro.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El `publish` es la raíz del repo, así que sin esto el código de las
# funciones —y con él la lista de invitados— quedaría descargable como
# archivo estático. Las funciones de verdad se sirven desde /api/*.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

# Las fotos originales del save the date viven en el repo como archivo,
# pero el sitio sólo usa una (ya procesada, en assets/). Sin esta regla
# cualquiera que adivine la ruta se baja la sesión completa de los novios.
[[redirects]]
  from = "/assets/savethedatepics/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/panel"
  to = "/panel.html"
  status = 200

[[redirects]]
  from = "/libro"
  to = "/libro.html"
  status = 200

# Links bonitos: /paloma-cambron en vez de /?i=paloma-cambron.
#
# Va al final a propósito: Netlify aplica las reglas en orden y sirve los
# archivos que existen antes de llegar aquí, así que /panel, /robots.txt,
# /assets/* y /api/* siguen resolviendo solos. Sólo cae aquí una ruta de un
# tramo que no corresponde a ningún archivo — que es justo la forma de un id.
#
# status 200 y no 301: es una reescritura, la barra de direcciones se queda
# con el link bonito. Eso significa que en el navegador NO hay `?i=`, así
# que site.js también lee el id de la ruta (ver `personalizar`).
#
# Un id que no exista no rompe nada: la API contesta 404 y el formulario
# vuelve a pedir el nombre a mano.
[[redirects]]
  from = "/:invitacion"
  to = "/index.html"
  status = 200
